    +'<td class="r">'+(invs.length?gdN(l.conf_qty):'—')+'</td><td class="r">'+gdN(l.recv_qty)+'</td>'
    +(arrOn?'<td class="r"><input type="number" min="0" class="gdnum" value="'+esc(G.arr[l.code]||'')+'" oninput="S.gd.arr[\''+l.code+'\']=this.value"></td>':'')
    +(money?'<td class="r small">'+rp(l.cost)+'</td><td class="r" id="gdpa_'+l.code+'">'+gdJt(gdPoQ(l)*Number(l.cost||0))+'</td>':'')+'</tr>';}).join('')+'</tbody></table></div>';
 if(edit)h+=gdBar('<input class="gdi" id="gdpc" placeholder="'+gT('加一个 SKU：条码','Tambah SKU: barcode')+'" style="width:200px"><input class="gdi" id="gdpq" type="number" min="1" placeholder="'+gT('数量','Jumlah')+'" style="width:90px">'+(col==='n'?'<input class="gdi" id="gdpw" placeholder="'+gT('原因','Alasan')+'" style="width:180px">':'')+gdBtn(gT('加上','Tambah'),'gdPoAdd()'));

 if((P.arrivals||[]).length)h+=gdSec(gT('到仓记录','Riwayat datang'))+'<div class="card">'+P.arrivals.map(function(a){return '<div class="small" style="padding:5px 0;border-bottom:1px solid #f0f0f0">'+esc(a.at)+' · '+esc(a.who)+(a.supplier?' · '+esc(a.supplier)+(a.invoice_no?' '+esc(a.invoice_no):''):'')+(a.dms_po_no?' · DMS '+esc(a.dms_po_no):'')+' · '+a.lines.reduce(function(s,x){return s+Number(x.qty)},0)+gT(' 件',' pcs')+'</div>';}).join('')+'</div>';

 return h;}
// 订货数量：按当前阶段取（还在改的数字也算进去），金额 = 数量 × 单价
function gdPoQ(l){var G=S.gd,st=G.pd.po.stage,col=st==='suggest'?'v':'n';if(['returned','arrived','closed'].indexOf(st)>=0)return Number(l.conf_qty||0);if((st==='suggest'||st==='victory')&&G.ped&&G.ped[l.code]!==undefined&&G.ped[l.code]!=='')return Number(G.ped[l.code])||0;var v=col==='v'?(l.v_qty!==null?l.v_qty:l.sug_qty):(l.n_qty!==null?l.n_qty:(l.v_qty!==null?l.v_qty:l.sug_qty));return Number(v||0);}
function gdPoSumTxt(rows){var q=0,v=0,money=S.gd.pd.can.money;rows.forEach(function(l){var x=gdPoQ(l);q+=x;v+=x*Number(l.cost||0);});return gT('合计 ','Total ')+'<b>'+gdN(q)+'</b>'+gT(' 件',' pcs')+(money?' · '+gT('预估采购 ','Estimasi ')+'<b>'+gdJt(v)+'</b>':'');}
function gdPoLive(code){var G=S.gd,l=(G.pd.lines||[]).find(function(x){return x.code===code});if(!l)return;var a=document.getElementById('gdpa_'+code);if(a)a.textContent=gdJt(gdPoQ(l)*Number(l.cost||0));var rows=(G.pd.lines||[]).filter(function(x){return (G.poRows||[]).indexOf(x.code)>=0});var e=document.getElementById('gdposum');if(e)e.innerHTML=gdPoSumTxt(rows);}
function gdPoChanges(){var G=S.gd,ch=[];Object.keys(G.ped||{}).forEach(function(k){if(String(G.ped[k])==='')return;ch.push({code:k,qty:Number(G.ped[k]),reason:(G.pwhy||{})[k]||''});});return ch;}
function gdPoSave(cb){var G=S.gd,ch=gdPoChanges();if(!ch.length){if(cb)cb();else toast(gT('没有改动','Tidak ada perubahan'));return;}gdCall('poSave',[G.po,ch],function(){G.ped={};G.pwhy={};if(cb)cb();else{toast(gT('已保存','Tersimpan'));gdPoOpen(G.po);}});}
function gdPoAdd(){var G=S.gd,c=document.getElementById('gdpc').value.trim(),q=Number(document.getElementById('gdpq').value),w=document.getElementById('gdpw');if(!c||!(q>0))return toast(gT('填条码和数量','Isi barcode dan jumlah'));gdCall('poSave',[G.po,[{code:c,qty:q,reason:w?w.value.trim():''}]],function(){gdPoOpen(G.po);});}
function gdPoNext(){var G=S.gd,st=G.pd.po.stage;if(st==='suggest'&&!confirm(gT('确认后按今天的数量定下这张 PO（今天的日期就是 PO 号），之后不再每天重算。确认？','Setelah dikonfirmasi, jumlah dikunci hari ini. Lanjut?')))return;gdPoSave(function(){gdCall('poNext',[G.po],function(r){toast(r.no?gT('PO 号 ','No. PO ')+r.no:'OK');gdPoOpen(G.po);});});}
function gdPoRefresh(){var G=S.gd;G.pd=null;render();gdCall('poRefresh',[G.po],function(){gdPoOpen(G.po);});}
function gdPoExport(rest){var G=S.gd;gdCall('poExport',[G.po,rest?1:0],function(r){gdDl(r);gdPoOpen(G.po);});}
function gdPoRet(inp){var f=inp.files&&inp.files[0],G=S.gd,sup=(document.getElementById('gdsup')||{}).value||'',inv=(document.getElementById('gdinv')||{}).value||'';inp.value='';if(!f)return;if(!sup.trim())return toast(gT('先填是哪家经销商','Isi nama distributor dulu'));
 var rd=new FileReader();rd.onload=function(){gdCall('poReturn',[G.po,sup.trim(),inv.trim(),String(rd.result)],function(r){toast(sup+gT('：对上 ',': cocok ')+r.matched+' SKU'+(r.invoice?' · '+r.invoice:''));gdPoOpen(G.po);});};rd.readAsDataURL(f);}
function gdInvDel(id){if(!confirm(gT('删除这份回传？（已登记到仓的不能删）','Hapus balasan ini?')))return;gdCall('poInvDel',[S.gd.po,id],function(){gdPoOpen(S.gd.po);});}
function gdInvSet(id){var v=prompt(gT('发票号','No. invoice'));if(!v)return;gdCall('poInvSet',[S.gd.po,id,v],function(){gdPoOpen(S.gd.po);});}
function gdArrFill(){var G=S.gd,i=(G.pd.invs||[]).find(function(x){return String(x.id)===String(G.arrInv)});if(!i)return toast(gT('先选发票','Pilih invoice dulu'));G.arr={};i.lines.forEach(function(x){G.arr[x.code]=x.qty;});render();}
function gdPoArrive(){var G=S.gd,items=Object.keys(G.arr||{}).map(function(k){return {code:k,qty:Number(G.arr[k])}}).filter(function(x){return x.qty>0});if(!items.length)return toast(gT('在「本次到货」填数量','Isi kolom "datang kali ini"'));
 gdCall('poArrive',[G.po,G.arrInv||null,(document.getElementById('gddms')||{}).value||'',items],function(){toast('OK');G.arr={};gdPoOpen(G.po);});}
function gdPoClose(){if(!confirm(gT('确定完结这张 PO？','Tutup PO ini?')))return;gdCall('poClose',[S.gd.po],function(){gdPoOpen(S.gd.po);});}
// 密码框加「眼睛」：点一下显示密码，再点一下隐藏（LK Hub / LK Toko 共用，2026-11-20）
(function(){
 var EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
 var OFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
 function add(i){if(i.getAttribute('data-eye'))return;i.setAttribute('data-eye','1');
  var cs=getComputedStyle(i),w=document.createElement('span');
  w.style.cssText='position:relative;display:block;margin:'+cs.marginTop+' '+cs.marginRight+' '+cs.marginBottom+' '+cs.marginLeft;
  i.parentNode.insertBefore(w,i);w.appendChild(i);i.style.margin='0';i.style.paddingRight='46px';i.style.width='100%';i.style.boxSizing='border-box';
  var b=document.createElement('button');b.type='button';b.tabIndex=-1;b.title=(typeof L!=='undefined'&&L==='zh')?'显示 / 隐藏密码':'Tampilkan / sembunyikan kata sandi';
  b.style.cssText='position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;margin:0;width:auto;min-height:0;cursor:pointer;color:#888;line-height:0;box-shadow:none';
  b.innerHTML=EYE;
  b.onmousedown=function(e){e.preventDefault();};
  b.onclick=function(e){e.preventDefault();e.stopPropagation();var show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?OFF:EYE;b.style.color=show?'#111':'#888';};
  w.appendChild(b);}
 function scan(){var l=document.querySelectorAll('input[type=password]:not([data-eye])');for(var k=0;k<l.length;k++)add(l[k]);}
 if(window.MutationObserver)new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
 scan();
})();
</script>
<script>
// 照片点开放大（待开发第 21 行②，两个 app 共用一份）：点照片弹出全屏大图，双指缩放、拖动，点空白处或右上角 × 关闭；一组多张左右滑看下一张
(function(){
 function isPhoto(el){if(!el||el.tagName!=='IMG'||el.getAttribute('onclick')||el.closest('[data-nozoom]'))return false;var s=el.currentSrc||el.src||'';if(!s)return false;
  if(/\/storage\/v1\/|^blob:|^data:image\//.test(s))return (el.naturalWidth||el.width||0)>=40;return false;}
 function group(el){var box=el.parentElement,i=0;while(box&&i<4){var im=[].slice.call(box.querySelectorAll('img')).filter(isPhoto);if(im.length>1||box.classList.contains('card'))return im.length?im:[el];box=box.parentElement;i++;}return [el];}
 var V=null;
 function open(list,idx){close();var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);touch-action:none;overflow:hidden;user-select:none';
  d.innerHTML='<img style="position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform-origin:center center;will-change:transform" draggable="false">'
   +'<div style="position:absolute;top:10px;right:14px;color:#fff;font-size:30px;line-height:1;cursor:pointer;padding:6px 10px" data-x>×</div>'
   +'<div style="position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#ccc;font-size:13px" data-n></div>';
  document.body.appendChild(d);V={d:d,img:d.querySelector('img'),list:list,i:idx,s:1,x:0,y:0};show();
  var t0=null,pinch=null,last=0,moved=false;
  d.addEventListener('click',function(e){if(e.target.hasAttribute('data-x')||(e.target===d&&!moved))close();});
  d.addEventListener('touchstart',function(e){moved=false;if(e.touches.length===2){pinch={d:dist(e),s:V.s};t0=null;}else if(e.touches.length===1){t0={x:e.touches[0].clientX,y:e.touches[0].clientY,ox:V.x,oy:V.y};var n=Date.now();if(n-last<280){V.s=V.s>1?1:2.5;V.x=0;V.y=0;apply();t0=null;}last=n;}},{passive:true});
  d.addEventListener('touchmove',function(e){moved=true;if(pinch&&e.touches.length===2){V.s=Math.max(1,Math.min(6,pinch.s*dist(e)/pinch.d));apply();}else if(t0&&e.touches.length===1){var dx=e.touches[0].clientX-t0.x,dy=e.touches[0].clientY-t0.y;if(V.s>1){V.x=t0.ox+dx;V.y=t0.oy+dy;apply();}else{V.x=dx;apply();}}},{passive:true});
  d.addEventListener('touchend',function(e){if(e.touches.length)return;if(pinch){pinch=null;if(V.s<=1.02){V.s=1;V.x=0;V.y=0;apply();}return;}
   if(t0&&V.s===1){var dx=V.x;V.x=0;if(dx<-60&&V.i<V.list.length-1){V.i++;show();}else if(dx>60&&V.i>0){V.i--;show();}else apply();}t0=null;});
  d.addEventListener('wheel',function(e){e.preventDefault();V.s=Math.max(1,Math.min(6,V.s*(e.deltaY<0?1.15:0.87)));if(V.s===1){V.x=0;V.y=0;}apply();},{passive:false});
  var md=null;d.addEventListener('mousedown',function(e){if(e.target!==V.img)return;md={x:e.clientX,y:e.clientY,ox:V.x,oy:V.y};e.preventDefault();});
  window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
  function mm(e){if(!md||!V)return;moved=true;V.x=md.ox+e.clientX-md.x;V.y=md.oy+e.clientY-md.y;apply();}
  function mu(){if(md&&V&&V.s===1){var dx=V.x;V.x=0;V.y=0;if(dx<-60&&V.i<V.list.length-1){V.i++;show();}else if(dx>60&&V.i>0){V.i--;show();}else apply();}md=null;}
  V.off=function(){window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);};
  document.addEventListener('keydown',key);}
 function key(e){if(!V)return;if(e.key==='Escape')close();if(e.key==='ArrowRight'&&V.i<V.list.length-1){V.i++;show();}if(e.key==='ArrowLeft'&&V.i>0){V.i--;show();}}
 function dist(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1;}
 function show(){V.s=1;V.x=0;V.y=0;V.img.src=V.list[V.i];apply();V.d.querySelector('[data-n]').textContent=V.list.length>1?(V.i+1)+' / '+V.list.length:'';}
 function apply(){V.img.style.transform='translate(-50%,-50%) translate('+V.x+'px,'+V.y+'px) scale('+V.s+')';}
 function close(){if(!V)return;V.off&&V.off();document.removeEventListener('keydown',key);V.d.remove();V=null;}
 window.pzOpen=function(list,idx){open(list,idx||0);};
 document.addEventListener('click',function(e){var el=e.target;if(!isPhoto(el)||V)return;var g=group(el);e.preventDefault();e.stopPropagation();open(g.map(function(x){return x.currentSrc||x.src;}),Math.max(0,g.indexOf(el)));},true);
})();
</script>
